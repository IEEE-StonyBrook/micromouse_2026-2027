; ESP32-C3 bridge: carries the CLI between the STM32's USART3 (1 Mbaud) and a
; host over BLE, as a Nordic UART Service. The bridging logic lives in
; lib/bridge (pure C++) and is tested on the host with `pio test -e native`.

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
test_ignore = *
; ARDUINO_USB_CDC_ON_BOOT routes Serial to the C3's USB Serial/JTAG port, so
; bridge diagnostics never reach the STM32 link. Set the UART pins from the
; schematic: they are the ESP32 side of the STM32 USART3 link.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBRIDGE_UART_RX_PIN=20
    -DBRIDGE_UART_TX_PIN=21
    -DBRIDGE_UART_BAUD=1000000
    -DBRIDGE_DEVICE_NAME=\"Jurababa\"

[env:native]
platform = native@1.2.1
test_framework = doctest
build_flags = -std=c++17 -Wall -Wextra -Werror
